[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idempotent-portfolio-rebalancer"
version = "0.1.0"
description = "Idempotent portfolio rebalancing automation with MarketStack quote freshness checks, staging sheet previews, and read-back verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
